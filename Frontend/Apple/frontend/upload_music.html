<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Music - Melodify Admin</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%B5</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mobile-topbar">
        <div class="logo">Melodify Admin</div>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">&#9776;</button>
    </div>

    <div class="main-layout admin-layout">
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <aside class="sidebar" id="sidebar">
            <div>
                <div class="logo">Melodify</div>
                <span class="logo-subtitle">Admin Panel</span>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="admin_dashboard.html" class="nav-link"><i class="icon-dashboard"></i> Overview</a></li>
                    <li><a href="upload_music.html" class="nav-link active"><i class="icon-music"></i> Upload Music</a></li>
                    <li><a href="admin_analytics.html" class="nav-link"><i class="icon-history"></i> Analytics</a></li>
                    <li><a href="http://127.0.0.1:8000/admin/" class="nav-link" target="_blank"><i class="icon-playlist"></i> Content Management</a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <a href="dashboard.html" class="back-to-app-link">&larr; Back to listener app</a>
                <button id="logout-btn" class="btn-logout"><i class="icon-logout"></i> Logout</button>
            </div>
        </aside>

        <div class="content-area">
            <header class="top-header">
                <div class="welcome-message">
                    <h1>Upload New Song</h1>
                    <p>Add a new track to the Melodify library.</p>
                </div>
            </header>

            <main class="main-content">
                <div class="upload-form-container">
                    <form id="upload-song-form">
                        <div id="upload-error-message" class="error-message"></div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="title">Song Title</label>
                                <input type="text" id="title" name="title" required>
                            </div>
                            <div class="form-group">
                                <label for="artist">Artist</label>
                                <select id="artist" name="artist" required><option value="">Loading artists...</option></select>
                            </div>
                            <div class="form-group">
                                <label for="album">Album</label>
                                <select id="album" name="album"><option value="">Select an album (optional)</option></select>
                            </div>
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select id="category" name="category"><option value="">Select a category (optional)</option></select>
                            </div>
                            <div class="form-group">
                                <label for="audio_file">Audio File (MP3, WAV)</label>
                                <input type="file" id="audio_file" name="audio_file" accept="audio/*" required>
                            </div>
                            <div class="form-group">
                                <label for="cover_image">Cover Image (JPG, PNG)</label>
                                <input type="file" id="cover_image" name="cover_image" accept="image/*">
                            </div>
                        </div>
                        <button type="submit" class="btn-submit">Upload Song</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/music.js"></script>
</body>
</html>
